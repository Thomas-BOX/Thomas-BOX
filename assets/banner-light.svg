<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
<title id="t">Thomas Box</title>
<desc id="d">Ingénieur concepteur, SQL et PL/SQL sur Oracle, outillage IA, Toulouse</desc>
<defs>
 <radialGradient id="g1" cx="0.85" cy="0.15" r="0.6"><stop offset="0" stop-color="#2563eb" stop-opacity="0.14"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2" cx="0.02" cy="1" r="0.5"><stop offset="0" stop-color="#0891b2" stop-opacity="0.1"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
 <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.4" stop-color="#fff" stop-opacity="0"/><stop offset="0.8" stop-color="#fff" stop-opacity="1"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#0f172a" stroke-opacity="0.05"/></pattern>
 <mask id="gm"><rect width="1280" height="360" fill="url(#fade)"/></mask>
 <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
</defs>
<style>
 .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .float{animation:float 8s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes blink{50%{opacity:0}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @media (prefers-reduced-motion: reduce){.flow,.blink,.pulse,.float{animation:none}}
</style>
<g clip-path="url(#card)">
