  <text x="2" y="300" font-size="15" fill="#2563eb" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">&gt; sql · pl/sql · typescript · python<tspan class="blink" fill="#2563eb">▍</tspan></text>
 </g>
 <g transform="translate(915 185) scale(1.18) translate(-915 -185)"><g class="float"><path id="p1" d="M895 120 H935" fill="none" stroke="#94a3b8" stroke-width="2" class="flow"/><path id="p2" d="M1010 149 C1010 200 990 250 990 250" fill="none" stroke="#94a3b8" stroke-width="2" class="flow"/><path id="p3" d="M840 250 C820 250 820 200 820 149" fill="none" stroke="#94a3b8" stroke-width="2" class="flow"/><g><rect x="745" y="91" width="150" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="820" y="117" text-anchor="middle" font-size="17" font-weight="600" fill="#334155" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">Données</text><text x="820" y="137" text-anchor="middle" font-size="12" fill="#475569" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">Oracle · PostgreSQL</text></g><g><rect x="935" y="91" width="150" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1010" y="117" text-anchor="middle" font-size="17" font-weight="600" fill="#334155" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">Batchs</text><text x="1010" y="137" text-anchor="middle" font-size="12" fill="#475569" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">SQL · PL/SQL</text></g><g><rect x="840" y="221" width="150" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="915" y="247" text-anchor="middle" font-size="17" font-weight="600" fill="#334155" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">Agents IA</text><text x="915" y="267" text-anchor="middle" font-size="12" fill="#475569" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">MCP · skills</text></g><circle r="5" fill="#2563eb"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#p1" xlink:href="#p1"/></animateMotion></circle><circle r="5" fill="#2563eb"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2" xlink:href="#p2"/></animateMotion></circle><circle r="5" fill="#0891b2"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3" xlink:href="#p3"/></animateMotion></circle></g></g>
